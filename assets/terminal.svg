  <title id="title">begench@127.0.0.1: fastfetch and git log --oneline career</title>
  <desc id="desc">Animated terminal. fastfetch: begench@tomsk, fullstack developer at Synecta, M.S. Applied Informatics at Tomsk State University, stack TypeScript, React, TanStack, C++, agents Claude Code, OpenCode, OpenClaw, Neovim and tmux on Omarchy Linux, Russian and English (C1). git log of career: Synecta (fullstack, web app for RF measurement instruments), AdHaven (fullstack, led 3 devs, shipped 3 projects in 9 months), MarPla (frontend, rewrote the frontend on React and MobX in 3 months), TCA (frontend, e-reporting app that cut paperwork by 40%).</desc>
