    /* Animation. Un-animated styles ARE the final frame, so renderers without
       CSS animation (or reduced-motion users) see the finished session.
       .tf = transient typing frame: hidden, shown only during its own slot
       .in = final content: hidden from load until animation-duration ends,
             then the un-animated (visible) style takes over. No fill-mode on
             purpose: delayed fill-mode reveals do not fire in Chrome when the SVG is embedded as an image. */
    .tf { opacity: 0; animation-name: on; animation-timing-function: step-end; }
    .in { animation-name: hide; animation-timing-function: step-end; }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes on { from, to { opacity: 1; } }
    @keyframes hide { from, to { opacity: 0; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
