<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-label="pantheon: Telegram gateway that gives every allowed user an isolated OpenClaw agent">
  <title>pantheon: Telegram gateway that gives every allowed user an isolated OpenClaw agent</title>
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    .lbl  { font-size: 12px; letter-spacing: .2em; fill: #00ff41; }
    .meta { font-size: 11px; letter-spacing: .16em; fill: #d1decb; }
    .name { font-size: 21px; font-weight: 700; letter-spacing: -.01em; fill: #f2f1f0; }
    .desc { font-size: 12.5px; fill: #d1decb; }
    .chip { font-size: 10px; font-weight: 700; letter-spacing: .1em; fill: #ffd393; }
    .cta  { font-size: 11px; letter-spacing: .18em; fill: #00ff41; }
  </style>
  <rect x=".5" y=".5" width="419" height="235" fill="#0e0e0e" stroke="#4a5d45" stroke-opacity=".6"/>
  <rect x="1" y="42" width="418" height="1" fill="#4a5d45" fill-opacity=".35"/>
  <text x="20" y="26" class="lbl">[PRJ_01]</text>
  <text x="400" y="26" text-anchor="end" class="meta">PUBLIC</text>
  <text x="20" y="80" class="name">PANTHEON</text>
  <text x="400" y="80" text-anchor="end" class="meta">AUG 2026 — NOW</text>
  <text x="20" y="108" class="desc">Telegram gateway to OpenClaw agents. Every</text>
  <text x="20" y="128" class="desc">allowed user gets an isolated agent with its</text>
  <text x="20" y="148" class="desc">own workspace, memory and reminders.</text>
  <rect x="20.5" y="166.5" width="87" height="19" fill="#ffd393" fill-opacity=".1" stroke="#ffd393" stroke-opacity=".3"/>
  <text x="64.5" y="179.5" text-anchor="middle" class="chip">TYPESCRIPT</text>
  <rect x="114.5" y="166.5" width="37" height="19" fill="#ffd393" fill-opacity=".1" stroke="#ffd393" stroke-opacity=".3"/>
  <text x="133.5" y="179.5" text-anchor="middle" class="chip">BUN</text>
  <rect x="158.5" y="166.5" width="58" height="19" fill="#ffd393" fill-opacity=".1" stroke="#ffd393" stroke-opacity=".3"/>
  <text x="188.0" y="179.5" text-anchor="middle" class="chip">GRAMMY</text>
  <text x="20" y="216" class="cta">OPEN REPO -&gt;</text>
</svg>
