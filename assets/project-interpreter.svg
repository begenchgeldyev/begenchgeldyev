<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-label="interpreter: custom language with a table-driven LL(1) parser that emits RPN">
  <title>interpreter: custom language with a table-driven LL(1) parser that emits RPN</title>
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    .lbl  { font-size: 12px; letter-spacing: .2em; fill: #00ff41; }
    .meta { font-size: 11px; letter-spacing: .16em; fill: #d1decb; }
    .name { font-size: 21px; font-weight: 700; letter-spacing: -.01em; fill: #f2f1f0; }
    .desc { font-size: 12.5px; fill: #d1decb; }
    .chip { font-size: 10px; font-weight: 700; letter-spacing: .1em; fill: #ffd393; }
    .cta  { font-size: 11px; letter-spacing: .18em; fill: #00ff41; }
  </style>
  <rect x=".5" y=".5" width="419" height="235" fill="#0e0e0e" stroke="#4a5d45" stroke-opacity=".6"/>
  <rect x="1" y="42" width="418" height="1" fill="#4a5d45" fill-opacity=".35"/>
  <text x="20" y="26" class="lbl">[PRJ_03]</text>
  <text x="400" y="26" text-anchor="end" class="meta">PUBLIC</text>
  <text x="20" y="80" class="name">INTERPRETER</text>
  <text x="400" y="80" text-anchor="end" class="meta">2025</text>
  <text x="20" y="108" class="desc">A small language from its own context-free</text>
  <text x="20" y="128" class="desc">grammar: a table-driven LL(1) parser emits RPN</text>
  <text x="20" y="148" class="desc">in a single pass, then executes it.</text>
  <rect x="20.5" y="166.5" width="37" height="19" fill="#ffd393" fill-opacity=".1" stroke="#ffd393" stroke-opacity=".3"/>
  <text x="39.5" y="179.5" text-anchor="middle" class="chip">C++</text>
  <rect x="64.5" y="166.5" width="51" height="19" fill="#ffd393" fill-opacity=".1" stroke="#ffd393" stroke-opacity=".3"/>
  <text x="90.5" y="179.5" text-anchor="middle" class="chip">LL(1)</text>
  <rect x="122.5" y="166.5" width="37" height="19" fill="#ffd393" fill-opacity=".1" stroke="#ffd393" stroke-opacity=".3"/>
  <text x="141.5" y="179.5" text-anchor="middle" class="chip">RPN</text>
  <text x="20" y="216" class="cta">OPEN REPO -&gt;</text>
</svg>
